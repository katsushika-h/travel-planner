
name: travel-planner

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
        POSTGRES_DB: travelplanner
        POSTGRES_USER: travelplanner
        POSTGRES_PASSWORD: travelplanner
        DATABASE_URL: postgresql://travelplanner:travelplanner@postgres:5432/travelplanner?schema=public
        APP_PORT: 3000

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  migrate:
    image: hokusaik/travel-planner-migrator:latest
    environment:
      DATABASE_URL: postgresql://travelplanner:travelplanner@postgres:5432/travelplanner?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    security_opt:
      - no-new-privileges:true

  app:
    image: hokusaik/travel-planner-app:latest
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://travelplanner:travelplanner@postgres:5432/travelplanner?schema=public
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - 3030:3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/trips').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:

volumes:
  postgres-data:
