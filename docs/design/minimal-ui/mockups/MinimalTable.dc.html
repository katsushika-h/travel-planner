<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfarer, minimal table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111;text-underline-offset:3px}a:hover{color:#D9381E}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 940px; display: flex; flex-direction: column; background: #FFFFFF; color: #111111; font-family: Geist, system-ui, sans-serif; font-size: 15px">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px; padding: 28px 48px 0">
    <button type="button" aria-label="Switch trip, current trip Kyoto and Osaka" style="display: flex; align-items: baseline; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer">
      <span style="font-weight: 500; font-size: 20px; letter-spacing: -0.01em">Kyoto &amp; Osaka</span>
      <span style="font-size: 14px; color: #6B6B6B">Apr 3 – 10</span>
    </button>
    <nav aria-label="Views" style="flex: 1; display: flex; flex-wrap: wrap; gap: 28px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <a href="#" aria-current="{{t.current}}" style="padding: 12px 0; font-size: 14px; text-decoration: none; {{t.style}}">{{t.label}}</a>
      </sc-for>
    </nav>
    <button type="button" aria-label="Search" style="width: 40px; height: 40px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    </button>
    <button type="button" aria-label="Add a stop" style="width: 40px; height: 40px; border: 1px solid #111111; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 36px 48px 16px">
    <h1 style="margin: 0; font-weight: 500; font-size: 22px; letter-spacing: -0.01em">All items <span style="font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 400; color: #6B6B6B">24</span></h1>
    <label style="display: flex; align-items: center; gap: 8px; min-width: 260px; min-height: 40px; border-bottom: 1px solid #111111">
      <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter items</span>
      <input type="text" placeholder="Filter by title, place or type" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: #111111">
    </label>
  </div>

  <!-- Bulk action bar for the current selection -->
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; margin: 0 48px; padding: 10px 0; border-top: 1px solid #111111; border-bottom: 1px solid #EBEBEA; font-size: 14px">
    <span style="font-weight: 500">2 selected</span>
    <button type="button" style="padding: 4px 0; border: 0; background: transparent; cursor: pointer">Change type</button>
    <button type="button" style="padding: 4px 0; border: 0; background: transparent; cursor: pointer">Move to day</button>
    <button type="button" style="padding: 4px 0; border: 0; background: transparent; cursor: pointer">Unschedule</button>
    <button type="button" style="padding: 4px 0; border: 0; background: transparent; color: #B42318; cursor: pointer">Delete</button>
    <button type="button" style="margin-left: auto; padding: 4px 0; border: 0; background: transparent; color: #6B6B6B; cursor: pointer">Clear</button>
  </div>

  <div style="flex: 1; padding: 0 48px 48px; overflow-x: auto">
    <table style="width: 100%; min-width: 900px; border-collapse: collapse; font-size: 14px">
      <thead>
        <tr style="text-align: left; font-size: 12px; color: #6B6B6B">
          <th scope="col" style="width: 40px; padding: 12px 0; font-weight: 400"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Select</span></th>
          <th scope="col" style="padding: 12px 12px 12px 0; font-weight: 400">Date</th>
          <th scope="col" style="padding: 12px; font-weight: 400">Time</th>
          <th scope="col" style="padding: 12px; font-weight: 400">Title</th>
          <th scope="col" style="padding: 12px; font-weight: 400">Type</th>
          <th scope="col" style="padding: 12px; font-weight: 400">Place</th>
          <th scope="col" style="padding: 12px 0 12px 12px; font-weight: 400; text-align: right">Planned</th>
        </tr>
      </thead>
      <tbody>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
          <tr style="border-top: 1px solid #EBEBEA; {{r.rowStyle}}">
            <td style="padding: 11px 0"><input type="checkbox" aria-label="{{r.selectLabel}}" checked="{{r.selected}}" style="width: 16px; height: 16px; margin: 0; accent-color: #111111"></td>
            <td style="padding: 11px 12px 11px 0; font-family: 'Geist Mono', monospace; font-size: 13px; color: {{r.dateColor}}; white-space: nowrap">{{r.date}}</td>
            <td style="padding: 11px 12px; font-family: 'Geist Mono', monospace; font-size: 13px; white-space: nowrap">{{r.time}}</td>
            <td style="padding: 11px 12px; font-weight: 500">{{r.title}}</td>
            <td style="padding: 11px 12px; color: #6B6B6B">{{r.type}}</td>
            <td style="padding: 11px 12px; color: #6B6B6B">{{r.place}}</td>
            <td style="padding: 11px 0 11px 12px; text-align: right; font-family: 'Geist Mono', monospace; font-size: 13px">{{r.cost}}</td>
          </tr>
        </sc-for>
      </tbody>
      <tfoot>
        <tr style="border-top: 1px solid #111111">
          <td colspan="6" style="padding: 14px 0; font-size: 13px; color: #6B6B6B">Planned total · JPY only, actual spend lives in Spend</td>
          <td style="padding: 14px 0; text-align: right; font-family: 'Geist Mono', monospace; font-weight: 500">¥64,780</td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":940}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Sat 03', '16:00–17:20', 'Haruka Express', 'Transit', 'KIX → Kyoto Station', '¥3,600'],
      ['Sat 03', '~19:30', 'Dinner near Nishiki', 'Food', 'Nakagyo-ku', '¥5,000'],
      ['Sun 04', '08:00–09:30', 'Fushimi Inari', 'Sightseeing', 'Fushimi-ku', '—'],
      ['Sun 04', '10:00–11:00', 'Tofuku-ji', 'Sightseeing', 'Higashiyama', '¥600'],
      ['Mon 05', '08:30–09:00', 'Coffee at % Arabica', 'Food', 'Higashiyama', '¥1,200'],
      ['Mon 05', '09:15–11:00', 'Kiyomizu-dera', 'Sightseeing', 'Higashiyama', '¥500', true],
      ['Mon 05', '~12:00', 'Yudofu lunch · Okutan', 'Food', 'Kiyomizu', '¥4,400', true],
      ['Mon 05', '13:30–15:00', 'Kodai-ji', 'Sightseeing', 'Higashiyama', '¥600'],
      ['Mon 05', '18:30–20:30', 'Kaiseki dinner', 'Food', 'Gion', '¥12,000'],
      ['Tue 06', '08:00–10:00', 'Bamboo grove', 'Sightseeing', 'Arashiyama', '—'],
      ['Wed 07', '10:00–10:30', 'Train to Osaka', 'Transit', 'Kyoto → Umeda', '¥580'],
      ['Fri 09', '~18:00', 'Dotonbori street food', 'Food', 'Chuo-ku', '¥3,000'],
      ['Idea', '—', 'teamLab Botanical Garden', 'Activity', 'Osaka', '¥1,800'],
      ['Idea', '—', "Philosopher's Path", 'Sightseeing', 'Sakyo-ku', '—']
    ];
    const tabs = ['Plan', 'Calendar', 'Board', 'Table', 'Map', 'Spend'];
    return {
      tabs: tabs.map((label, i) => ({ label, current: i === 3 ? 'page' : 'false', style: i === 3 ? 'color: #111111; font-weight: 500; box-shadow: inset 0 -1px 0 #111111' : 'color: #6B6B6B' })),
      rows: data.map(([date, time, title, type, place, cost, selected], i) => ({ date: i > 0 && data[i - 1][0] === date && date !== 'Idea' ? '' : date, time, title, type, place, cost, selected: !!selected,
        selectLabel: 'Select ' + title, dateColor: date === 'Idea' ? '#D9381E' : '#111111', rowStyle: selected ? 'background: #F6F6F4' : '' }))
    };
  }
}
</script>
</body>
</html>
