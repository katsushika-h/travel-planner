<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfarer day view on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4F0; color: #17191C; font-family: Geist, system-ui, sans-serif; font-size: 14px; overflow: hidden; position: relative">

  <header style="padding: 20px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" aria-label="Switch trip" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 650; font-size: 24px; letter-spacing: -0.02em">Kyoto &amp; Osaka</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#17191C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <button type="button" aria-label="Search" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E3DD; display: grid; place-items: center">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#17191C" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 6px; overflow: hidden">
      <button type="button" style="flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 1px solid #E3E3DD; border-radius: 10px; background: #FFFFFF; font-size: 13px">Sat 3</button>
      <button type="button" style="flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 1px solid #E3E3DD; border-radius: 10px; background: #FFFFFF; font-size: 13px">Sun 4</button>
      <button type="button" aria-pressed="true" style="flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 1px solid #17191C; border-radius: 10px; background: #17191C; color: #FFFFFF; font-size: 13px; font-weight: 600">Mon 5</button>
      <button type="button" style="flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 1px solid #E3E3DD; border-radius: 10px; background: #FFFFFF; font-size: 13px">Tue 6</button>
      <button type="button" style="flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 1px solid #E3E3DD; border-radius: 10px; background: #FFFFFF; font-size: 13px">Wed 7</button>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-weight: 600">Day 3 · Monday</span>
      <span style="font-size: 13px; color: #5E6166">6 items · ¥18,700 planned</span>
    </div>
  </header>

  <ol style="list-style: none; margin: 0; padding: 0 16px; flex: 1; display: flex; flex-direction: column; overflow: hidden">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
      <li style="display: grid; grid-template-columns: 44px 16px minmax(0, 1fr); column-gap: 8px">
        <span style="padding-top: 13px; text-align: right; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500">{{item.time}}</span>
        <span style="position: relative; display: flex; justify-content: center">
          <span style="position: absolute; top: 0; bottom: 0; width: 2px; background: #E3E3DD"></span>
          <span style="position: relative; margin-top: 16px; width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; {{item.node}}"></span>
        </span>
        <span style="padding: 4px 0">
          <button type="button" style="width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid #E3E3DD; border-radius: 12px; background: #FFFFFF; text-align: left">
            <span style="font-weight: 600">{{item.title}}</span>
            <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5E6166"><span style="width: 7px; height: 7px; border-radius: 2px; background: {{item.color}}"></span>{{item.meta}}</span>
          </button>
        </span>
      </li>
    </sc-for>
  </ol>

  <button type="button" aria-label="Add to this day" style="position: absolute; right: 16px; bottom: 100px; width: 56px; height: 56px; border: 0; border-radius: 18px; background: #0B6B57; box-shadow: 0 10px 24px -8px rgba(11,107,87,0.6); display: grid; place-items: center">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </button>

  <nav aria-label="Workspace" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 8px 22px; background: #FFFFFF; border-top: 1px solid #E3E3DD">
    <button type="button" aria-current="page" style="min-height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #17191C">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Day
    </button>
    <button type="button" style="min-height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5E6166">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendar
    </button>
    <button type="button" style="min-height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5E6166">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Places
    </button>
    <button type="button" style="min-height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5E6166">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Spend
    </button>
    <button type="button" style="min-height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5E6166">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#5E6166"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>More
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const C = { food: ['Food', '#E07A1F'], sightseeing: ['Sightseeing', '#0E9384'] };
    const rows = [
      ['08:30', 'food', 'Coffee at % Arabica', 'Higashiyama · ¥1,200'],
      ['09:15', 'sightseeing', 'Kiyomizu-dera', 'Until 11:00 · ¥500'],
      ['~12:00', 'food', 'Yudofu lunch · Okutan', 'Flexible · ¥4,400', true],
      ['13:30', 'sightseeing', 'Kodai-ji', 'Until 15:00 · ¥600'],
      ['15:30', 'sightseeing', 'Yasaka Shrine', 'Gion · Free'],
      ['18:30', 'food', 'Kaiseki dinner', 'Gion · Booked · ¥12,000']
    ];
    return { items: rows.map(([time, type, title, meta, flex]) => ({ time, title, meta, color: C[type][1],
      node: flex ? 'border: 2px dashed ' + C[type][1] + '; background: #F4F4F0' : 'border: 2px solid #F4F4F0; background: ' + C[type][1] + '; box-shadow: 0 0 0 1px ' + C[type][1] })) };
  }
}
</script>
</body>
</html>
