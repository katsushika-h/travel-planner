<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wayfarer, minimal board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111;text-underline-offset:3px}a:hover{color:#D9381E}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="min-height: 940px; display: flex; flex-direction: column; background: #FFFFFF; color: #111111; font-family: Geist, system-ui, sans-serif; font-size: 15px">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px; padding: 28px 48px 0">
    <button type="button" aria-label="Switch trip, current trip Kyoto and Osaka" style="display: flex; align-items: baseline; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer">
      <span style="font-weight: 500; font-size: 20px; letter-spacing: -0.01em">Kyoto &amp; Osaka</span>
      <span style="font-size: 14px; color: #6B6B6B">Apr 3 – 10</span>
    </button>
    <nav aria-label="Views" style="flex: 1; display: flex; flex-wrap: wrap; gap: 28px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <a href="#" aria-current="{{t.current}}" style="padding: 12px 0; font-size: 14px; text-decoration: none; {{t.style}}">{{t.label}}</a>
      </sc-for>
    </nav>
    <button type="button" aria-label="Search" style="width: 40px; height: 40px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    </button>
    <button type="button" aria-label="Add a stop" style="width: 40px; height: 40px; border: 1px solid #111111; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; padding: 36px 48px 20px">
    <h1 style="margin: 0; font-weight: 500; font-size: 22px; letter-spacing: -0.01em">By type</h1>
    <div style="display: flex; gap: 28px; font-size: 14px">
      <button type="button" aria-pressed="true" style="padding: 8px 0; border: 0; background: transparent; font-weight: 500; box-shadow: inset 0 -1px 0 #111111; cursor: pointer">All</button>
      <button type="button" style="padding: 8px 0; border: 0; background: transparent; color: #6B6B6B; cursor: pointer">Scheduled</button>
      <button type="button" style="padding: 8px 0; border: 0; background: transparent; color: #6B6B6B; cursor: pointer">Ideas only</button>
    </div>
  </div>

  <div style="flex: 1; padding: 0 48px 48px; overflow-x: auto">
    <div style="display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 24px; min-width: 1240px">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="6">
        <section aria-label="{{c.name}}" style="display: flex; flex-direction: column; border-top: 3px solid {{c.color}}">
          <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 12px 0 14px">
            <h2 style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: {{c.ink}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: {{c.color}}"></span>{{c.name}}</h2>
            <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #6B6B6B">{{c.count}}</span>
          </div>
          <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="3">
            <button type="button" style="display: flex; flex-direction: column; gap: 4px; padding: 12px 0; border: 0; border-bottom: 1px solid #EBEBEA; background: transparent; text-align: left; cursor: grab">
              <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{k.whenColor}}">{{k.when}}</span>
              <span style="font-size: 15px; font-weight: 500; line-height: 1.3">{{k.title}}</span>
              <span style="font-size: 12px; color: #6B6B6B">{{k.place}}</span>
            </button>
          </sc-for>
          <button type="button" style="align-self: flex-start; margin-top: 8px; padding: 8px 0; border: 0; background: transparent; font-size: 13px; color: #6B6B6B; cursor: pointer">+ Add</button>
        </section>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":940}}'>
class Component extends DCLogic {
  renderVals() {
    // Type colours from lib/type-color.ts; `ink` is a darker shade of the same hue so heading text stays readable on white.
    const TYPE = { Food: ['#f97316', '#C2410C'], Sightseeing: ['#f43f5e', '#BE123C'], Stay: ['#8b5cf6', '#6D28D9'], Transit: ['#f59e0b', '#B45309'], Activity: ['#10b981', '#047857'], Unclassified: ['#64748b', '#475569'] };
    const c = (name, cards) => ({ name, color: TYPE[name][0], ink: TYPE[name][1], count: cards.length, cards: cards.map(([when, title, place]) => ({ when, title, place, whenColor: when === 'Idea' ? '#D9381E' : '#6B6B6B' })) });
    const cols = [
      c('Food', [['Sat 03 · ~19:30', 'Dinner near Nishiki', 'Nakagyo-ku'], ['Mon 05 · 08:30', 'Coffee at % Arabica', 'Higashiyama'], ['Mon 05 · ~12:00', 'Yudofu lunch · Okutan', 'Kiyomizu'], ['Mon 05 · 18:30', 'Kaiseki dinner', 'Gion'], ['Fri 09 · ~18:00', 'Dotonbori street food', 'Chuo-ku'], ['Idea', 'Nishiki Market', 'Nakagyo-ku'], ['Idea', 'Kuromon Market', 'Osaka']]),
      c('Sightseeing', [['Sun 04 · 08:00', 'Fushimi Inari', 'Fushimi-ku'], ['Sun 04 · 10:00', 'Tofuku-ji', 'Higashiyama'], ['Mon 05 · 09:15', 'Kiyomizu-dera', 'Higashiyama'], ['Mon 05 · 13:30', 'Kodai-ji', 'Higashiyama'], ['Mon 05 · 15:30', 'Yasaka Shrine', 'Gion'], ['Tue 06 · 08:00', 'Bamboo grove', 'Arashiyama'], ['Idea', "Philosopher's Path", 'Sakyo-ku']]),
      c('Stay', [['Sat 03 → Wed 07', 'Hotel Kanra Kyoto', 'Shimogyo-ku'], ['Wed 07 → Sat 10', 'Cross Hotel Osaka', 'Shinsaibashi']]),
      c('Transit', [['Sat 03 · 08:00', 'SQ 618 · SIN → KIX', 'Kansai International'], ['Sat 03 · 16:00', 'Haruka Express', 'KIX → Kyoto Station'], ['Wed 07 · 10:00', 'Train to Osaka', 'Kyoto → Umeda'], ['Sat 10 · 11:10', 'SQ 619 · KIX → SIN', 'Kansai International']]),
      c('Activity', [['Idea', 'teamLab Botanical Garden', 'Osaka'], ['Idea', 'Kurama to Kibune hike', 'Sakyo-ku']]),
      c('Unclassified', [['Thu 08 · anytime', 'Umeda Sky Building', 'Kita-ku']])
    ];
    const tabs = ['Plan', 'Calendar', 'Board', 'Table', 'Map', 'Spend'];
    return { cols, tabs: tabs.map((label, i) => ({ label, current: i === 2 ? 'page' : 'false', style: i === 2 ? 'color: #111111; font-weight: 500; box-shadow: inset 0 -1px 0 #111111' : 'color: #6B6B6B' })) };
  }
}
</script>
</body>
</html>
